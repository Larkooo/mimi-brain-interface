name: Validate Mimi
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Mimi CI {0} {1}', inputs.head_sha, inputs.base_sha) || 'Validate Mimi' }}

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ inputs.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_HEAD: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          git checkout --detach "$BASE_SHA"
          git -c user.name='Mimi CI' -c user.email='mimi-ci@users.noreply.github.com' merge --no-commit --no-ff "$CANDIDATE_HEAD"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev autoconf automake libtool pkg-config
      - run: python3 -m unittest discover -s scripts -p 'test_maintain.py'
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: bun install --frozen-lockfile && bun run build
        working-directory: dashboard
